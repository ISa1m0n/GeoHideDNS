name: Update filtered GeoHide hosts

on:
  schedule:
    - cron: "17 20 * * *"
  push:
    paths:                  # пересобирать сразу, если поменялись списки
      - bad-ips.txt
      - sections.txt
      - pin-ips.txt
      - filter.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build filtered hosts
        run: bash filter.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hosts-ai.txt
          git diff --cached --quiet || git commit -m "Update hosts-ai.txt"
          git push
